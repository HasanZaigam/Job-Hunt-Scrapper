# Keeps the Supabase free-tier project awake.
#
# Supabase pauses a free project after 7 consecutive days with no database
# activity. This job runs every 2 days and makes one tiny read against the
# public REST API, which resets that 7-day timer — so the dashboard never
# shows an empty page because the DB went to sleep.
#
# Uses the PUBLIC anon key + URL from repo secrets NEXT_PUBLIC_SUPABASE_URL /
# NEXT_PUBLIC_SUPABASE_ANON_KEY (the same values the dashboard ships to browsers).
# The secret service key is NOT used here.
#
# Manual run: Actions tab -> "Supabase keep-alive" -> Run workflow.

name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 */2 * *' # every 2 days at 06:17 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_ANON: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Ping Supabase REST (resets the 7-day pause timer)
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON" ]; then
            echo "::error::Add repo secrets NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY (Settings -> Secrets and variables -> Actions)."; exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "apikey: $SUPABASE_ANON" \
            -H "Authorization: Bearer $SUPABASE_ANON" \
            "$SUPABASE_URL/rest/v1/applications?select=id&limit=1") || { echo "::error::Cannot reach Supabase (project paused or wrong URL)"; exit 1; }
          echo "Supabase responded with HTTP $code"
          # 200 (rows or empty under RLS) both mean the query reached Postgres = DB is awake.
          if [ "$code" -ge 500 ]; then
            echo "::error::Supabase looks down/paused (HTTP $code)"; exit 1
          fi
